name: langstats

on:
  schedule:
    - cron: "17 4 * * 1"   # weekly, Mondays 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/langstats.py"
      - ".github/workflows/langstats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild language block and push
        env:
          # Built-in token: public repos only, expires with the run.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional PAT that can also see private repos. Referenced from the
          # secret store, never written into the repo, and masked in logs.
          # Absent secret resolves to empty and the run stays public-only.
          LANGSTATS_TOKEN: ${{ secrets.LANGSTATS_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # README.md and the chart SVG are both generated output, so always
          # rebuild them on top of the latest branch tip. A concurrent edit
          # then costs a retry instead of a merge conflict.
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            python3 scripts/langstats.py

            # Both files, not just the README: the README's ?v= fingerprint is
            # a hash of the SVG's bytes, so committing one without the other
            # points the cache-buster at an image that was never pushed.
            if [ -z "$(git status --porcelain README.md assets/langstats.svg)" ]; then
              echo "no change"
              exit 0
            fi

            git add README.md assets/langstats.svg
            git commit -m "Update language stats"

            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi

            echo "push raced with another commit, retrying"
            sleep 5
          done

          echo "could not push after 3 attempts"
          exit 1
