<svg xmlns="http://www.w3.org/2000/svg" width="276" height="162"
     viewBox="0 0 276 162" role="img" aria-label="Languages by use, most used first: JavaScript, Kotlin, TypeScript, Go, Java, Shell">
  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      fill: #8b949e;
    }
    .bar { fill: #58a6ff; }
    .track { fill: #58a6ff; opacity: 0.15; }
    @media (prefers-color-scheme: light) {
      text { fill: #57606a; }
      .bar, .track { fill: #0969da; }
    }
  </style>
  <text x="1" y="16">$ ls ~/languages</text>
  <text class="name" x="1" y="44">JavaScript</text>
  <rect class="track" x="94" y="37" width="180" height="6" rx="3" />
  <rect class="bar" x="94" y="37" width="180" height="6" rx="3" />
  <text class="name" x="1" y="66">Kotlin</text>
  <rect class="track" x="94" y="59" width="180" height="6" rx="3" />
  <rect class="bar" x="94" y="59" width="111" height="6" rx="3" />
  <text class="name" x="1" y="88">TypeScript</text>
  <rect class="track" x="94" y="81" width="180" height="6" rx="3" />
  <rect class="bar" x="94" y="81" width="82" height="6" rx="3" />
  <text class="name" x="1" y="110">Go</text>
  <rect class="track" x="94" y="103" width="180" height="6" rx="3" />
  <rect class="bar" x="94" y="103" width="70" height="6" rx="3" />
  <text class="name" x="1" y="132">Java</text>
  <rect class="track" x="94" y="125" width="180" height="6" rx="3" />
  <rect class="bar" x="94" y="125" width="40" height="6" rx="3" />
  <text class="name" x="1" y="154">Shell</text>
  <rect class="track" x="94" y="147" width="180" height="6" rx="3" />
  <rect class="bar" x="94" y="147" width="35" height="6" rx="3" />
</svg>
